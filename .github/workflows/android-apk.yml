# Path: .github/workflows/android-apk.yml
name: Android Debug APK

on:
  push:
    branches:
      - arena/7e89a722-box-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            diagnostics="$(grep -E '(^e: |^> Task .* FAILED|^FAILURE:|^\\* What went wrong:|^Execution failed for task|^Caused by:|^Could not |^.*error:)' "$RUNNER_TEMP/gradle-build.log" | tail -n 60)"
            if [[ -z "$diagnostics" ]]; then
              diagnostics="$(tail -n 60 "$RUNNER_TEMP/gradle-build.log")"
            fi
            diagnostics="${diagnostics//'%'/'%25'}"
            diagnostics="${diagnostics//$'\r'/'%0D'}"
            diagnostics="${diagnostics//$'\n'/'%0A'}"
            printf '::error title=Gradle build diagnostics::%s\n' "$diagnostics"
          fi
          exit "$status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: box-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
